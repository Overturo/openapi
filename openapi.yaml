  "/api/v1/breach_scope":
    get:
      description: 'Reports what a credential reached in a window: how many people''s
        records, which actions, and which permissions. Counts and categories only
        — never record contents. Every response states what the audit trail does not
        record, so the result is never mistaken for a complete picture. Requires the
        audit:verify API-token scope.'
      operationId: BreachScope_show
      parameters:
      - description: The credential type to assess. Unknown types are refused.
        in: query
        name: credential_kind
        required: false
        schema:
          type: string
      - description: The credential's identifier. It is never stored or returned —
          only a one-way fingerprint of it appears in the report.
        in: query
        name: credential_ref
        required: false
        schema:
          type: string
      - description: Window start (defaults to 30 days ago).
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - description: Window end (defaults to now).
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
