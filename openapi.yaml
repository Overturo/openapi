---
components:
  schemas:
    AgentIdentity:
      properties:
        agent_type:
          type: string
        created_at:
          format: date-time
          type: string
        delegation_grant_id:
          nullable: true
          type: string
        display_name:
          type: string
        id:
          type: string
        oauth_application_id:
          nullable: true
          type: string
        status:
          enum:
          - active
          - suspended
          - revoked
          type: string
      type: object
    AgentIdentityList:
      properties:
        agent_identities:
          items:
            "$ref": "#/components/schemas/AgentIdentity"
          type: array
      type: object
    Agreement:
      properties:
        activated_at:
          format: date-time
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        parties:
          items:
            type: string
          type: array
        quorum_status:
          type: string
        status:
          type: string
        title:
          type: string
      type: object
    AgreementList:
      properties:
        agreements:
          items:
            "$ref": "#/components/schemas/Agreement"
          type: array
      type: object
    AllowedOrigin:
      properties:
        last_seen_at:
          description: Most recent successful preflight from this origin (computed
            from audit log)
          format: date-time
          nullable: true
          type: string
        origin:
          example: https://merchant.com
          type: string
      required:
      - origin
      type: object
    AllowedOriginEnvelope:
      properties:
        allowed_origin:
          "$ref": "#/components/schemas/AllowedOrigin"
      type: object
    AllowedOriginList:
      properties:
        allowed_origins:
          items:
            "$ref": "#/components/schemas/AllowedOrigin"
          type: array
      type: object
    ApiToken:
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        id:
          example: api_token_dev_abc123
          type: string
        last_used_at:
          format: date-time
          nullable: true
          type: string
        name:
          example: ci
          type: string
        permissions:
          example:
          - read
          items:
            enum:
            - read
            - write
            - admin
            type: string
          type: array
        token:
          description: Raw bearer value. Returned ONLY on create + rotate; never on
            subsequent reads.
          type: string
      required:
      - id
      - name
      - permissions
      - created_at
      type: object
    ApiTokenEnvelope:
      properties:
        api_token:
          "$ref": "#/components/schemas/ApiToken"
      type: object
    ApiTokenList:
      properties:
        api_tokens:
          items:
            "$ref": "#/components/schemas/ApiToken"
          type: array
      type: object
    AuthorizationReceipt:
      properties:
        authorization_receipt:
          additionalProperties: true
          description: The canonical authorization record (overturo-cr/2 document;
            schema published at /schemas/receipt/v2/record.json). The signed flavor
            returns the export envelope instead; dpv returns JSON-LD.
          type: object
      type: object
    BreachScope:
      additionalProperties: true
      description: What a credential reached in a time window — counts and categories
        only, with an explicit statement of what the audit trail does not record.
      properties:
        caveats:
          description: 'The limits of this report: the coverage boundary, and every
            credential type whose activity is not recorded.'
          type: object
        coverage:
          description: Whether this credential type's activity is fully, partly, or
            not recorded.
          type: object
        credential:
          description: The credential type asked about, and a one-way fingerprint
            of the identifier. The identifier itself is never returned.
          type: object
        events_by_type:
          description: Recorded actions grouped by type.
          type: object
        records_count:
          description: How many recorded actions are attributable to it.
          type: integer
        scopes_involved:
          description: Permissions involved in those actions.
          items:
            type: string
          type: array
        subjects_affected:
          description: How many people's records this credential reached.
          type: integer
        window:
          description: The period assessed.
          type: object
      required:
      - credential
      - window
      - subjects_affected
      - records_count
      - coverage
      - caveats
      type: object
    BreachScopeEvidence:
      additionalProperties: true
      description: A signed, anchored credential-impact report — independently verifiable.
      properties:
        evidence_package_id:
          type: string
        format_type:
          type: string
        package:
          description: The signed, verifiable package payload.
          type: object
      required:
      - evidence_package_id
      - format_type
      - package
      type: object
    CleanRoomEnvironment:
      properties:
        agreement_id:
          type: string
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        id:
          type: string
        participants:
          items:
            type: string
          type: array
        status:
          type: string
      type: object
    CleanRoomList:
      properties:
        clean_rooms:
          items:
            "$ref": "#/components/schemas/CleanRoomEnvironment"
          type: array
      type: object
    ConsentSession:
      properties:
        created_at:
          format: date-time
          type: string
        delivery_mode:
          enum:
          - iframe
          - popup
          - redirect
          - inline
          type: string
        embed_url:
          format: uri
          type: string
        expires_at:
          format: date-time
          type: string
        flow_id:
          type: string
        id:
          type: string
        status:
          type: string
      type: object
    CreateAgentIdentityRequest:
      properties:
        agent_type:
          type: string
        display_name:
          type: string
        metadata:
          additionalProperties: true
          type: object
        oauth_application_id:
          type: string
      required:
      - display_name
      type: object
    CreateAllowedOriginRequest:
      properties:
        allowed_origin:
          properties:
            origin:
              example: https://merchant.com
              type: string
          required:
          - origin
          type: object
      required:
      - allowed_origin
      type: object
    CreateApiTokenRequest:
      properties:
        api_token:
          properties:
            expires_at:
              format: date-time
              nullable: true
              type: string
            name:
              example: ci
              type: string
            permissions:
              description: Subset of [read, write, admin]. Defaults to ['read'] if
                omitted. Issuing 'admin' requires the caller to already hold 'admin'.
              items:
                enum:
                - read
                - write
                - admin
                type: string
              type: array
          required:
          - name
          type: object
      required:
      - api_token
      type: object
    CreateCleanRoomRequest:
      properties:
        agreement_id:
          type: string
        expires_at:
          format: date-time
          type: string
        participants:
          items:
            type: string
          type: array
      required:
      - agreement_id
      - participants
      type: object
    CreateConsentSessionRequest:
      properties:
        delivery_mode:
          enum:
          - iframe
          - popup
          - redirect
          - inline
          type: string
        flow_id:
          type: string
        metadata:
          additionalProperties: true
          type: object
        redirect_uri:
          format: uri
          type: string
      required:
      - flow_id
      type: object
    CreateDecisionRequest:
      properties:
        delivery_mode:
          enum:
          - embed
          - popup
          - redirect
          type: string
        embed_origin:
          description: Required for delivery_mode=embed
          format: uri
          type: string
        kind:
          enum:
          - consent
          - approval
          type: string
        redirect_uri:
          format: uri
          type: string
        scope:
          type: string
        state:
          type: string
        subject_ref:
          description: Prefix ID of the subject (Flow ID for consent, Escalation ID
            for approval)
          type: string
      required:
      - kind
      - subject_ref
      - delivery_mode
      type: object
    CreateDisclosureReceiptRequest:
      properties:
        agent_id:
          description: The disclosed agent's public identifier.
          type: string
        disclosed_at:
          description: The declared disclosure moment (ISO 8601). Never in the future;
            never before the agent's registration.
          format: date-time
          type: string
        flow_id:
          description: The flow the disclosure relates to — must be owned by the token's
            account and must disclose the named agent.
          type: string
        locale:
          description: Optional locale for the frozen record's language context.
          type: string
      required:
      - flow_id
      - agent_id
      - disclosed_at
      type: object
    CreateFlowRequest:
      properties:
        flow:
          properties:
            config:
              additionalProperties: true
              type: object
            description:
              type: string
            pattern:
              description: Flow pattern (e.g. standard, recurring, broadcast)
              type: string
            title:
              type: string
          required:
          - pattern
          - title
          type: object
      required:
      - flow
      type: object
    CreatePolicyRequest:
      properties:
        config:
          additionalProperties: true
          type: object
        template_id:
          type: string
        title:
          type: string
      required:
      - template_id
      type: object
    CreatePresentationRequestBody:
      additionalProperties: false
      properties:
        claims:
          description: Claim names to request — ask only for what you need.
          items:
            type: string
          type: array
        credential_types:
          description: Credential types the user may present.
          items:
            type: string
          type: array
        trusted_issuers:
          description: Issuer keys from your trusted-issuer configuration; leave empty
            to accept any trusted issuer.
          items:
            type: string
          type: array
        ttl_seconds:
          description: How long the request stays presentable (default 600, max 86400).
          type: integer
      required:
      - credential_types
      type: object
    Decision:
      description: A decision session token + kind-aware metadata. The unified surface
        for consent, approval, and future kinds.
      properties:
        decision:
          properties:
            deadline_at:
              format: date-time
              nullable: true
              type: string
            decision_url:
              format: uri
              type: string
            embed_url:
              format: uri
              type: string
            kind:
              description: Closed-enum decision kind
              enum:
              - consent
              - approval
              type: string
            mode:
              description: Delivery mode
              enum:
              - embed
              - popup
              - redirect
              type: string
            session_token:
              description: 43-char URL-safe Base64 session token
              type: string
            status:
              enum:
              - pending
              - opened
              - in_progress
              - completed
              - cancelled
              - expired
              type: string
            subject_ref:
              description: Public prefix ID of the underlying subject (Flow ID for
                consent, Escalation ID for approval)
              type: string
          required:
          - session_token
          - kind
          - mode
          type: object
      required:
      - decision
      type: object
    DisclosureReceipt:
      properties:
        disclosure_receipt:
          properties:
            record:
              additionalProperties: true
              description: The frozen anonymous notice record; delivery provenance
                is always operator-declared — no payload field can claim platform
                delivery.
              type: object
            record_id:
              description: The durable record's public identifier.
              type: string
          type: object
      type: object
    Empty:
      description: Empty response (e.g. 204 No Content)
      type: object
    Error:
      properties:
        error:
          properties:
            code:
              description: Machine-readable kebab-case error code
              type: string
            details:
              additionalProperties: true
              type: object
            message:
              description: Human-readable error description
              type: string
          required:
          - code
          - message
          type: object
      required:
      - error
      type: object
    Flow:
      properties:
        application_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          example: flw_dev_abc123
          type: string
        pattern:
          description: Flow pattern (e.g. standard, recurring, broadcast)
          type: string
        status:
          enum:
          - draft
          - active
          - deprecated
          - archived
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          type: integer
      type: object
    FlowDisclosures:
      additionalProperties: false
      description: What a flow will ask a person to agree to, before any decision
        session exists. No personal data — the flow's own disclosure inventory, in
        the person's language.
      properties:
        application:
          additionalProperties: false
          description: The application's branding, as the person will see it.
          properties:
            logo_url:
              type:
              - string
              - 'null'
            name:
              type: string
            primary_color:
              type:
              - string
              - 'null'
          type: object
        expiry:
          additionalProperties: false
          description: How long a granted consent lasts.
          properties:
            consent_duration_days:
              type:
              - integer
              - 'null'
          type: object
        fields:
          description: Fields shown in the flow — what the person fills in and what
            the application states, plus any conditions or proofs.
          items:
            additionalProperties: false
            properties:
              completed_by:
                description: 'Who completes the field: the person, the application,
                  or both.'
                type: string
              field_type:
                type: string
              label:
                type: string
              name:
                type: string
              required:
                type: boolean
              section:
                description: input, obligation, or proof.
                type: string
            type: object
          type: array
        flow:
          additionalProperties: false
          description: The flow's public identity.
          properties:
            id:
              description: The flow's public id — the same id you pass when you create
                a decision.
              type: string
            kind:
              description: Always "consent" — the only kind with a pre-session disclosure.
              type: string
            name:
              type: string
            version:
              type: integer
          type: object
        locale:
          additionalProperties: false
          description: Which language was requested and which resolved.
          properties:
            fallback:
              type: string
            requested:
              type: string
            resolved:
              type: string
          type: object
        outcomes:
          description: The possible outcomes — granted or denied.
          items:
            type: string
          type: array
        presentation:
          additionalProperties: false
          description: How the decision is presented — the action label the person
            acts on.
          properties:
            button_mode:
              type: string
            display_label:
              type: string
          type: object
        purposes:
          description: Each purpose the person will be asked to agree to — a localized
            title and description, the requested data in plain labels, and whether
            it is required.
          items:
            additionalProperties: false
            properties:
              data_labels:
                description: The requested data, shown as the person sees it — plain
                  labels only.
                items:
                  type: string
                type: array
              description:
                type:
                - string
                - 'null'
              label:
                description: Localized title.
                type: string
              legal_basis:
                type: string
              mechanism:
                type: string
              name:
                type: string
              required:
                type: boolean
            type: object
          type: array
        revision:
          description: An opaque revision marker — changes when the flow or its purposes
            change.
          type: string
        schema:
          description: The disclosure inventory schema version.
          type: string
        steps:
          description: The steps the person moves through.
          items:
            additionalProperties: false
            properties:
              key:
                type: string
              title:
                type: string
            type: object
          type: array
      required:
      - schema
      - flow
      - application
      - purposes
      - fields
      - steps
      - presentation
      - outcomes
      - expiry
      - locale
      - revision
      type: object
    FlowList:
      properties:
        flows:
          items:
            "$ref": "#/components/schemas/Flow"
          type: array
      type: object
    Health:
      properties:
        region:
          example: us
          type: string
        status:
          enum:
          - ok
          - degraded
          type: string
        version:
          example: v1
          type: string
      required:
      - status
      - version
      - region
      type: object
    MarketplaceApplication:
      properties:
        description:
          type: string
        id:
          type: string
        industry:
          type: string
        install_url:
          format: uri
          type: string
        name:
          type: string
        rating:
          type: number
        surface:
          type: string
        verified:
          type: boolean
      type: object
    MarketplaceApplicationList:
      properties:
        applications:
          items:
            "$ref": "#/components/schemas/MarketplaceApplication"
          type: array
        pagination:
          "$ref": "#/components/schemas/Pagination"
      type: object
    OpenapiDocument:
      additionalProperties: true
      description: OpenAPI 3.1 document. See https://spec.openapis.org/oas/v3.1.0
      required:
      - openapi
      - info
      - paths
      - components
      type: object
    Pagination:
      properties:
        page:
          minimum: 1
          type: integer
        per_page:
          maximum: 100
          minimum: 1
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    Policy:
      properties:
        activated_at:
          format: date-time
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        pattern:
          description: Policy pattern (e.g. standing_mandate, dsar_request)
          type: string
        status:
          enum:
          - draft
          - active
          - deprecated
          - archived
          type: string
        template_id:
          nullable: true
          type: string
        title:
          type: string
      type: object
    PolicyList:
      properties:
        policies:
          items:
            "$ref": "#/components/schemas/Policy"
          type: array
      type: object
    PresentationRequest:
      description: 'A digital-credential presentation request: your user proves something
        from a credential in their wallet, and your application reads the verified
        outcome here.'
      properties:
        claims:
          description: Disclosed claims — present only once the presentation is verified.
          nullable: true
          type: object
        error_code:
          description: Failure reason once a presentation fails.
          nullable: true
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          example: preq_2c3d...
          type: string
        request_object_url:
          description: Where the wallet fetches the signed request.
          type: string
        status:
          enum:
          - pending
          - verified
          - failed
          - expired
          - cancelled
          type: string
        verified_at:
          format: date-time
          nullable: true
          type: string
        wallet_uri:
          description: Deep link the user's wallet opens to receive the request. Render
            it as a QR code for cross-device flows.
          type: string
      required:
      - id
      - status
      type: object
    ResidencyPosture:
      additionalProperties: false
      description: Where your subjects' data is stored, per country, with an assurance
        status. Countries and counts only — no personal data.
      properties:
        assurance:
          description: Assurance status — assured unless a flagged or incomplete transfer
            exists.
          type: object
        disclosure_ledger:
          description: 'What crossed a border: local minimized pointers plus the transfer
            register.'
          type: object
        generated_at:
          format: date-time
          type: string
        residency_map:
          description: 'Per-country residency map: how many subjects are stored in
            each country, joined with that country''s published facts.'
          type: object
      required:
      - residency_map
      - assurance
      - disclosure_ledger
      - generated_at
      type: object
    ResidencyPostureEvidence:
      additionalProperties: true
      description: A signed, anchored Proof of Residency — independently verifiable.
      properties:
        evidence_package_id:
          type: string
        format_type:
          type: string
        package:
          description: The signed, verifiable package payload.
          type: object
      required:
      - evidence_package_id
      - format_type
      - package
      type: object
    TransferRegister:
      additionalProperties: false
      description: Cross-border transfers of personal data, each with the lawful basis
        it relied on and the adequacy verdict for the country pair.
      properties:
        flagged_count:
          description: Transfers recorded without a satisfactory basis (require attention).
          type: integer
        transfers:
          description: 'One row per recorded transfer: the lawful basis (Chapter V),
            the adequacy verdict (adequate / extra safeguards / own request), and
            the country pair.'
          items:
            type: object
          type: array
      required:
      - transfers
      - flagged_count
      type: object
    TransferRegisterEvidence:
      additionalProperties: true
      description: A signed, anchored, independently-verifiable evidence package of
        the transfer register.
      properties:
        evidence_package_id:
          type: string
        format_type:
          type: string
        package:
          description: The signed, verifiable package payload.
          type: object
      required:
      - evidence_package_id
      - format_type
      - package
      type: object
    UpdateFlowRequest:
      properties:
        flow:
          properties:
            config:
              additionalProperties: true
              type: object
            description:
              type: string
            title:
              type: string
          type: object
      type: object
    Version:
      properties:
        deprecation:
          description: ISO 8601 sunset date once a successor version ships; null while
            v1 is current
          format: date
          nullable: true
          type: string
        release:
          description: Git SHA or release tag of the deployed build
          example: abcd1234
          type: string
        version:
          example: v1
          type: string
      required:
      - version
      - release
      type: object
    WalletCredential:
      properties:
        credential_type:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        issued_at:
          format: date-time
          type: string
        issuer:
          type: string
        presentation_count:
          type: integer
        revoked_at:
          format: date-time
          nullable: true
          type: string
      type: object
    WalletList:
      properties:
        credentials:
          items:
            "$ref": "#/components/schemas/WalletCredential"
          type: array
      type: object
  securitySchemes:
    api_token:
      description: Bearer <token>
      in: header
      name: Authorization
      type: apiKey
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:4444/oauth2/auth
          scopes: {}
          tokenUrl: http://localhost:4444/oauth2/token
      type: oauth2
    publishable_key:
      in: header
      name: X-Publishable-Key
      type: apiKey
info:
  contact:
    url: https://overturo.com/surfaces/developer
  description: Trust orchestration platform — REST API.
  title: Overturo API
  version: v1
openapi: 3.1.0
paths:
  "/api/v1/accounts":
    get:
      operationId: Accounts_index
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Empty"
          description: OK
        '400':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Unprocessable Content
        '500':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Internal Server Error
      security:
      - api_token: []
      summary: Index Accounts
      tags:
      - Core
  "/api/v1/add_ons":
    get:
      operationId: AddOns_index
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Empty"
          description: OK
        '400':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: Not Found
        '422':
          content:
            application/json:
